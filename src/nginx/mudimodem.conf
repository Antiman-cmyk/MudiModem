# MudiModem — installed as /etc/nginx/gl-conf.d/mudimodem.conf, which GL's
# gl.conf includes inside its server block. Serves our view chunks and the AT
# library from /usr/share/mudimodem/www: an E5800 firmware upgrade never
# restores /www, so nothing of ours lives there. gzip_static is on globally.
# `^~` prefix matches win over gl.conf's regex locations and touch none of
# GL's own /views/* chunks.

location ^~ /views/gl-sdk4-ui-mudimodem {
    root /usr/share/mudimodem/www;
}

location ^~ /mudimodem/ {
    root /usr/share/mudimodem/www;
}
